# Schema para validação dos Use Cases
# usecase-schema.yaml
$schema: http://json-schema.org/draft-07/schema#

```yaml
# usecase-schema.yaml
schema: http://json-schema.org/draft-07/schema#
title: Use Case Schema
type: object
required:
  - metadata
  - sections

properties:
  metadata:
    type: object
    required:
      - id
      - title
      - version
      - status
      - priority
      - complexity
      - effort
      - stakeholders
      - dates
    properties:
      id:
        type: string
        pattern: ^UC-\d{3}$
      title:
        type: string
        minLength: 5
        maxLength: 100
      version:
        type: string
        pattern: ^\d+\.\d+$
      status:
        type: string
        enum: [draft, review, approved, implemented]
      priority:
        type: string
        enum: [low, medium, high, critical]
      complexity:
        type: string
        enum: [low, medium, high]
      effort:
        type: string
        enum: [low, medium, high]
      stakeholders:
        type: object
        required:
          - owner
          - team
        properties:
          owner:
            type: string
          team:
            type: string
          client:
            type: string
      dates:
        type: object
        required:
          - created
        properties:
          created:
            type: string
            format: date
          updated:
            type: string
            format: date
          approved:
            type: string
            format: date
          implemented:
            type: string
            format: date

  sections:
    type: object
    required:
      - description
      - actors
      - preconditions
      - flow
      - postconditions
      - acceptance
    properties:
      description:
        type: object
        required:
          - objective
          - context
          - scope
        properties:
          objective:
            type: string
            minLength: 10
          context:
            type: object
            properties:
              current:
                type: string
              problem:
                type: string
              benefits:
                type: array
                items:
                  type: string
          scope:
            type: object
            required:
              - in_scope
              - out_scope
            properties:
              in_scope:
                type: array
                items:
                  type: string
              out_scope:
                type: array
                items:
                  type: string

      actors:
        type: object
        required:
          - primary
        properties:
          primary:
            type: array
            items:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                description:
                  type: string
          secondary:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string

      preconditions:
        type: array
        items:
          type: string
        minItems: 1

      flow:
        type: object
        required:
          - main
        properties:
          main:
            type: array
            items:
              type: object
              required:
                - step
                - description
              properties:
                step:
                  type: number
                description:
                  type: string
                validation:
                  type: string
          alternative:
            type: array
            items:
              type: object
              required:
                - name
                - condition
                - steps
              properties:
                name:
                  type: string
                condition:
                  type: string
                steps:
                  type: array
                  items:
                    type: string
          exception:
            type: array
            items:
              type: object
              required:
                - error
                - handling
                - result
              properties:
                error:
                  type: string
                handling:
                  type: string
                result:
                  type: string

      postconditions:
        type: array
        items:
          type: string
        minItems: 1

      acceptance:
        type: object
        required:
          - functional
          - non_functional
        properties:
          functional:
            type: array
            items:
              type: object
              required:
                - scenario
                - given
                - when
                - then
              properties:
                scenario:
                  type: string
                given:
                  type: string
                when:
                  type: string
                then:
                  type: string
          non_functional:
            type: array
            items:
              type: string

      implementation:
        type: object
        properties:
          technologies:
            type: array
            items:
              type: string
          dependencies:
            type: array
            items:
              type: string
          considerations:
            type: array
            items:
              type: string

      revisions:
        type: array
        items:
          type: object
          required:
            - version
            - date
            - author
            - changes
          properties:
            version:
              type: string
            date:
              type: string
              format: date
            author:
              type: string
            changes:
              type: string

      approvals:
        type: array
        items:
          type: object
          required:
            - role
            - name
            - date
          properties:
            role:
              type: string
            name:
              type: string
            date:
              type: string
              format: date
```